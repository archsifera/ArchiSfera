name: Publish ArchiSfera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://www.archisfera.net/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate production build and SEO
        run: |
          npm ci
          npm test
          npm run build
          npm run check:seo
      - name: Build for GitHub Pages
        run: npm run build:pages
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish verified files
        run: |
          test -f dist/index.html
          test -d published/.git
          rsync -a --delete --exclude='.git' dist/ published/
          touch published/.nojekyll
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -A
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m "Publish ${GITHUB_SHA}"
            git -C published push origin HEAD:gh-pages
          fi
      - name: Request GitHub Pages build
        run: gh api "repos/${GITHUB_REPOSITORY}/pages/builds" --method POST
        env:
          GH_TOKEN: ${{ github.token }}
